apply plugin: 'com.android.application'

android {
    namespace 'com.akm.jon.fakegps'
    compileSdk 34

    defaultConfig {
        applicationId "com.akm.jon.fakegps"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
	manifestPlaceholders = [MAPS_API_KEY: System.getenv("MAPS_API_KEY") ?: ""]
    }
    lint {
        // Mengabaikan peringatan MockLocation dan mencegah build gagal karena peringatan Lint lainnya
        disable 'MockLocation'
        abortOnError false
        checkReleaseBuilds false
    }
    signingConfigs {
        release {
            // Membaca file keystore yang didecode oleh GitHub Actions
            storeFile file("release-key.jks")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
	    signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

}
