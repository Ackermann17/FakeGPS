name: Build FakeGPS APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # Sesudah (baru)
      - name: Decode Keystore File
        run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      # Build Release APK dengan API Key dan variabel Signature
      - name: Build Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Upload hasil APK Release yang sudah ditandatangani
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-Release-APK
          path: app/build/outputs/apk/release/*.apk
